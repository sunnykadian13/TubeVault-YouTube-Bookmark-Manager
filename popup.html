<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TubeVault</title>
  <link rel="stylesheet" href="lib/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon32.png" alt="" width="22" height="22">
      <span>TubeVault</span>
    </div>
    <div class="top-right">
      <span id="count" class="count"></span>
      <button id="open-dashboard" class="btn btn-sm" type="button">Open dashboard</button>
    </div>
  </header>

  <main>
    <section id="current" class="current" aria-label="Current video" aria-live="polite"></section>

    <section class="library" aria-label="Saved videos">
      <div class="filters">
        <div class="search">
          <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 1 0 0-14z M20 20l-3.5-3.5"/></svg>
          <input id="search" class="input" type="search" placeholder="Search titles and notes" aria-label="Search saved videos" autocomplete="off">
        </div>
        <select id="category-filter" class="select" aria-label="Filter by category"></select>
      </div>
      <div class="list-head"><h2 id="list-title">Recently saved</h2></div>
      <div id="list" class="list"></div>
    </section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
